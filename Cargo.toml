[workspace]
resolver = "2"
members = ["crates/wolf-core", "crates/wolf-ffi", "crates/wolf-gnome"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# crates/wolf-gnome/tests/release_profile.rs reads this table line by line, not as TOML, so an
# inline `# why` after a key becomes part of its value. Reasons: notes/Cargo.toml.md#release-profile
[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
debug = "line-tables-only"
strip = "none"
