[package]
name = "wolf-gnome"
description = "GTK4/Adwaita front-end for Wolf: a single windowed application (adw::ApplicationWindow + DrawingArea) that wires the headlessly-testable seams (gdk_key input translation + Cairo/Pango paint + pure pixel->grid geometry) onto a live WolfCore. Files are opened from Neovim (:e), the built-in file picker, the file-tree sidebar, or the native Open File / Open Folder dialogs, and saved from Neovim (:w, :saveas), the primary menu's native Save / Save As dialogs, or Ctrl+Shift+S."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "wolf_gnome"
path = "src/lib.rs"

# The windowed app. Declaring `[[bin]]` also exports `CARGO_BIN_EXE_wolf-gnome` to the tests.
[[bin]]
name = "wolf-gnome"
path = "src/main.rs"

[dependencies]
wolf-core = { path = "../wolf-core" }

# One coherent gtk-rs release set; `v4_8` is pinned here because a public signature names it.
# See notes/crates/wolf-gnome/Cargo.toml.md#gtk-rs-release-set
gdk = { version = "0.11", package = "gdk4", features = ["v4_8"] }
# Same release set as gdk4 0.11 (libadwaita 0.9 needs gtk4 0.11, gdk4 0.11, cairo-pango 0.22).
# No version feature on adw: Wolf targets the system GTK, not a newer pinned ABI.
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9", package = "libadwaita" }
# `v2_52` matches the flake's webkitgtk; gtk4 must keep `v4_10` or above for `gtk::Accessible`.
# See notes/crates/wolf-gnome/Cargo.toml.md#webkit6-features
webkit6 = { version = "0.6", features = ["v2_52"] }
# `png` is load-bearing: a cage smoke run by every `cargo test` decodes its `grim` captures with
# `ImageSurface::create_from_png`.
cairo = { version = "0.22", package = "cairo-rs", features = ["png"] }
pango = "0.22"
pangocairo = "0.22"
# Coalescing wake channel: the tokio worker fires a Send+Sync wake closure that
# pushes onto this channel; the GTK main loop drains it via spawn_future_local.
async-channel = "2"
# Encodes the preview's body swap as a JS string literal (see `pane_view::preview_swap_payload`).
# Same spec as wolf-core's, so the workspace lock does not move.
serde_json = "1"
