[package]
name = "wolf-gnome"
description = "GTK4/Adwaita front-end for Wolf: a single windowed application (adw::ApplicationWindow + DrawingArea) that wires the headlessly-testable seams (gdk_key input translation + Cairo/Pango paint + pure pixel->grid geometry) onto a live WolfCore. Files are opened from Neovim (:e), the built-in file picker, the file-tree sidebar, or the native Open File / Open Folder dialogs; saving is still from within Neovim."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "wolf_gnome"
path = "src/lib.rs"

# The windowed application binary. Declaring this `[[bin]]` is also what makes
# Cargo export `CARGO_BIN_EXE_wolf-gnome` to the integration tests (the headless
# smoke test locates the built binary via that env var).
[[bin]]
name = "wolf-gnome"
path = "src/main.rs"

[dependencies]
wolf-core = { path = "../wolf-core" }

# gtk-rs crates. NOTE on versioning: in the real gtk-rs ecosystem the gtk4-rs
# repo (gtk4/gdk4/gsk4) and the "core" repo (cairo-rs/pango/pangocairo/glib/...)
# are released together but carry DIFFERENT minor numbers; gdk4 0.11.x depends on
# the core crates at 0.22.x. So the invariant is "one coherent release set", not
# "one identical minor": gdk4 = 0.11 MUST be paired with cairo/pango/pangocairo =
# 0.22 (mismatched -sys minors fail to link). Deferred (window phase, do NOT add):
# gtk4 (gtk), libadwaita (adw).
# `v4_8` is what exposes `gdk::ScrollUnit`, which the pure `mouse::scroll_threshold`
# seam names in its public signature. gtk4's `v4_12` already turns it on
# transitively (v4_12 -> v4_10 -> v4_8 -> gdk/v4_8), but relying on ANOTHER crate's
# feature graph for a type this crate exposes in a public API is fragile — pin it
# here. Cargo.lock does not record features, so this changes no lock file and
# carries no CARGO_BAZEL_REPIN obligation.
gdk = { version = "0.11", package = "gdk4", features = ["v4_8"] }
# gtk4 (as `gtk`) and libadwaita (as `adw`) drive the actual window. They belong
# to the SAME coherent gtk-rs release set as gdk4 0.11 (libadwaita 0.9 depends on
# gtk4 0.11 / gdk4 0.11 / cairo-pango 0.22). NO version feature on adw (we target
# the system GTK already present, not a newer pinned ABI).
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9", package = "libadwaita" }
# cairo-rs is renamed to `cairo` and needs the `png` feature for ImageSurface PNG
# I/O (used by the #[ignore]d golden-regeneration dev-aid test).
cairo = { version = "0.22", package = "cairo-rs", features = ["png"] }
pango = "0.22"
pangocairo = "0.22"
# Coalescing wake channel: the tokio worker fires a Send+Sync wake closure that
# pushes onto this channel; the GTK main loop drains it via spawn_future_local.
async-channel = "2"
