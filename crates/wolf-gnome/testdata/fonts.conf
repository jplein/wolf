<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal, repo-controlled fontconfig used by wolf-gnome's deterministic golden
  render tests. It exposes ONLY the pinned DejaVu font directory (substituted by
  the flake shellHook via @DEJAVU_FONTS@) and deliberately omits every host font
  directory, so Pango/Cairo cannot pick up arbitrary host fonts. This keeps glyph
  measurement and rasterization reproducible across machines.

  The flake's shellHook rewrites @DEJAVU_FONTS@ to the Nix store path of
  pkgs.dejavu_fonts and points FONTCONFIG_FILE at the generated copy.
-->
<fontconfig>
  <!-- The single pinned font directory. -->
  <dir>@DEJAVU_FONTS@/share/fonts</dir>

  <!-- A writable cache dir under the system temp area; nothing host-specific. -->
  <cachedir>/tmp/wolf-fontconfig-cache</cachedir>

  <!-- Map the generic "monospace" family to the pinned DejaVu Sans Mono. -->
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
