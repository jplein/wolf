<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal, repo-controlled fontconfig used by wolf-gnome's deterministic golden
  render tests. It exposes ONLY three pinned font directories — DejaVu, JetBrains
  Mono and iA Writer Mono S — and deliberately omits every host font directory, so
  Pango/Cairo cannot pick up arbitrary host fonts. That omission is the property
  everything else rests on: it keeps glyph measurement and rasterization
  reproducible across machines. The two editor families are here because the
  shared wolf-config.yaml can name either, and `iA Writer Mono S` is what
  wolf_core's built-in defaults ask for.

  This file is a TEMPLATE. The flake's shellHook rewrites @DEJAVU_FONTS@,
  @JETBRAINS_MONO@ and @IA_WRITER_MONO@ to Nix store paths, writes the result to a
  temp file, and points FONTCONFIG_FILE at that copy — so editing the committed
  file has no effect until the next `nix develop` regenerates it.
-->
<fontconfig>
  <!-- The pinned font directories; fontconfig scans each recursively. -->
  <dir>@DEJAVU_FONTS@/share/fonts</dir>
  <dir>@JETBRAINS_MONO@/share/fonts</dir>
  <dir>@IA_WRITER_MONO@/share/fonts</dir>

  <!-- A writable cache dir under the system temp area; nothing host-specific. -->
  <cachedir>/tmp/wolf-fontconfig-cache</cachedir>

  <!--
    Map every GENERIC family onto a pinned face, so a generic request is
    deterministic with three families visible. "monospace" covers the editor
    grid's default. "sans-serif" and "sans" cover the pane statusbar strip, which
    asks for the desktop UI family and gets GTK's built-in "Sans" default on a
    host that configures none; both spellings are aliased because which one Pango
    hands fontconfig varies by version. Without them, and with the system's own
    generic rules omitted along with every host font dir, a generic request
    resolves to whichever pinned family fontconfig happens to sort first.

    The aliases only reach GENERIC requests. A CONCRETE family is what
    `gtk-font-name` usually names — it reads "Inter 11" on the dev host, a
    compiled schema default that reaches the app through XDG_DATA_DIRS, which the
    smokes' HOME redirect does not cover — and no alias can answer for a family
    the pinned trees do not hold. The last-resort rule below is what does.
  -->
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>

  <!--
    The last resort, appended at LOWEST priority to every pattern. A request the
    pinned trees can answer — "iA Writer Mono S", "DejaVu Sans Mono", or any
    other face in the three directories above — is untouched, because the
    appended name sorts behind everything the pattern already named. A request
    they cannot answer, such as a desktop UI family like "Inter" or "Cantarell",
    lands on this one pinned face instead of on whichever family fontconfig
    happens to sort first. That is what makes the statusbar strip AND the GTK
    chrome render the same way on every host, whatever the developer's desktop
    settings name.
  -->
  <match target="pattern">
    <edit name="family" mode="append_last"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
