[package]
name = "wolf-core"
description = "Platform-agnostic Rust core of Wolf: embeds and supervises a hermetic Neovim, folds the redraw stream into a render-state snapshot, and exposes an FFI-shaped front-end surface."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "wolf_core"
path = "src/lib.rs"

[dependencies]
nvim-rs = { version = "0.9.2", default-features = false, features = ["use_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "net", "time"] }
rmpv = "1.3"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
pulldown-latex = "0.7"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ignore = "0.4"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[[example]]
name = "grid_dump"
path = "examples/grid_dump.rs"
